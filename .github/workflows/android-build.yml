name: Build Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -name "gradlew" -type f

      - name: Make Gradle executable
        run: |
          chmod +x $(find . -name "gradlew" -type f | head -1)

      - name: Build AAB
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          ANDROID_DIR=$(dirname "$GRADLEW")
          cd "$ANDROID_DIR"
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Find AAB
        run: |
          echo "Searching for generated AAB..."
          find . -name "*.aab" -type f

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Course2App-AAB
          path: |
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
